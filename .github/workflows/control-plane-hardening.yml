name: Apex satellite hardening

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run typecheck
      - name: Verify standalone backend stays disabled
        run: |
          test ! -f railway.json
          test ! -f nixpacks.toml
          node -e "const p=require('./package.json'); if(!/DISABLED/.test(p.scripts.start||'')||!/DISABLED/.test(p.scripts['start:railway']||'')) process.exit(1)"
